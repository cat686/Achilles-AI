[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achilles-ai"
version = "0.2.0"
description = "Achilles-AI: sealed acceptance-testing evidence runtime for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Achilles-AI contributors"}]
dependencies = ["watchdog>=6,<8"]

[project.scripts]
verify = "goal_verifier.cli_v1:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
