[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achilles-ai"
version = "0.1.0"
description = "Achilles-AI: independent acceptance testing evidence runtime for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Achilles-AI contributors"}]
dependencies = []

[project.scripts]
verify = "goal_verifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
